# The Gradle this project builds with, pinned.
#
# gradle-wrapper.jar is NOT committed: it is a binary in a repository that keeps no other
# binaries, and it is regenerable from this file. .github/workflows/android.yml installs the same
# version directly and runs `gradle`, so CI does not need the jar either. To materialise the
# wrapper for local use:
#
#     cd android && gradle wrapper --gradle-version 8.11.1
#
# which writes gradlew, gradlew.bat and the jar from the distribution named below. Keeping this
# file and that command's version in step is what makes `./gradlew` and CI the same build.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
