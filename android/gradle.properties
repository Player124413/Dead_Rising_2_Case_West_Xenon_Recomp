# Defaults for the Android build. Everything here can be overridden on the command line
# with -P<key>=<value>, which is what tools/android/build_apk.sh and
# .github/workflows/android.yml do; the values below are the ones a developer who has run
# the prep scripts gets without thinking.
#
# The 228-TU recompiled image dominates every build time in this project, so the memory
# and caching settings are not tuning for their own sake.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# No AndroidX, and that is a decision rather than an omission. This app is four Kotlin
# files, an SDLActivity subclass and the Android framework: no Compose, no Lifecycle, no
# AppCompat. Every androidx artifact added here is one more thing for CI to download and
# one more version that can move under a build, in exchange for APIs the framework already
# has (SharedPreferences, ContentResolver, Vibrator, PowerManager). SDL's own Java is
# framework-only too, so this keeps the dependency list at exactly one entry: the Kotlin
# standard library. See app/build.gradle.kts.
android.useAndroidX=false
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------------------
# Where the prebuilt, cross-compiled dependencies are.
#
# tools/android/build_all.sh writes all four of these; each is per-ABI because a static
# library built for arm64 is not a static library built for x86_64, and the one honest way
# to keep that from being a link error is to have the ABI in the path.
# ---------------------------------------------------------------------------------------
cw.abi=arm64-v8a

# Paths are relative to the repository root, which is android/.. — the same root every
# other build script in tools/ resolves against.
cw.repoRoot=..
cw.prebuiltRoot=../third_party/android/arm64-v8a

# A static SDL2 built by tools/android/build_sdl2_android.sh, plus the Java half that goes
# with it. The two MUST come from the same SDL source tree: SDLActivity.onCreate compares
# its own SDL_MAJOR/MINOR/MICRO constants against the library's nativeGetVersion() and
# refuses to start on a mismatch, which is the right answer but reads like a broken build
# if you built the .a from one tag and copied the .java from another.
cw.sdl2Prefix=${cw.prebuiltRoot}/sdl2
cw.sdlJavaDir=../third_party/android/sdl-java

# ffmpeg: LGPL, xma1+xma2 only, from tools/android/build_ffmpeg_android.sh. Same shape as
# the desktop release dependency (tools/build_ffmpeg_lgpl.sh) and for the same reason.
cw.ffmpegPrefix=${cw.prebuiltRoot}/ffmpeg

# libadrenotools, from tools/android/build_adrenotools.sh. OPTIONAL: without it the app
# builds, runs and renders on the device's own Vulkan driver, and the launcher's driver row
# says "custom drivers unavailable" instead of listing Turnip builds. That is the honest
# failure; the dishonest one would be an APK that silently ignores a driver the player
# imported. Its staging directory also holds the four hook libraries adrenotools requires
# to be present in nativeLibraryDir (libmain_hook.so, libhook_impl.so,
# libfile_redirect_hook.so, libgsl_alloc_hook.so).
cw.adrenotoolsPrefix=${cw.prebuiltRoot}/adrenotools
cw.adrenotoolsJniLibs=../third_party/android/arm64-v8a/adrenotools/jniLibs

# The sibling checkouts and the build tree they produce. Same variables, same defaults and
# same meaning as runtime/CMakeLists.txt gives them on the desktop — an Android build that
# resolved XenonRecomp from somewhere else would be building a different XEX loader than
# the one every gotcha in docs/gotchas.md was written against.
#
# EMPTY means "the same default runtime/CMakeLists.txt uses", i.e. $HOME/GithubRepo/<name>.
# Gradle properties do not expand environment variables, so the expansion happens in
# app/build.gradle.kts where it can be seen; a literal "${HOME}" reaching CMake would be a
# directory that does not exist and a FATAL_ERROR naming a path with a dollar sign in it.
cw.xenonRoot=
cw.xenosRoot=

# The ARM64 build tree of XenonRecomp, holding the three static libraries the runtime links
# (XenonUtils, fmt, xxhash). It is NOT the sibling's own build/ directory: that one holds the
# HOST XenonRecomp executable, which is what generates ppc/ in the first place, and a
# cross-build into it would replace the tool with a binary this machine cannot run. Empty
# means <XenonRecomp>/build-android-arm64, which is what tools/android/build_xenon_android.sh
# writes.
cw.xenonBuild=

# The generated guest image. CI points this at a stub tree from tools/gen_stub_ppc.py
# because no runner may hold the game; a developer with the game points it at ppc/ and
# gets an APK that actually plays. Unset, runtime/CMakeLists.txt uses the sibling ppc/.
cw.ppcDir=

# App identity. versionCode is what the framework compares on an upgrade, so it has to
# move; versionName is what the launcher's About row and a bug report show.
cw.versionCode=1
cw.versionName=0.1.0-android

# The NDK. Pinned because AGP will otherwise use whichever NDK it likes best this year, and
# the NDK decides the clang that compiles 228 generated translation units.
cw.ndkVersion=27.2.12479018
