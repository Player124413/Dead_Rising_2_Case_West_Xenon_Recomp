# The Android build (docs/android-port-plan.md).
#
# WHAT A GREEN TICK HERE MEANS, scoped exactly the way build.yml scopes itself:
#
#   * every Android source in runtime/ COMPILES for arm64 with the NDK's clang — including the
#     four that are inert everywhere else (cpu/touch_input.cpp, host/android_bridge.cpp,
#     host/android_perf.cpp, gpu/vk_shadow_android.cpp), which are in the shared source list
#     precisely so that build.yml compile-checks them too;
#   * the runtime LINKS as a shared library against a static SDL2, a static LGPL ffmpeg and
#     arm64 XenonUtils, with no libxlive and no linked libvulkan;
#   * an APK is produced whose lib/<abi>/ holds libcw_runtime.so and, when adrenotools is in the
#     build, its four hook libraries, with extractNativeLibs true;
#   * the two generated stubs are current (XLive's and the Vulkan shadow header);
#   * on a push to master, the artifact BOOTS: an x86_64 emulator installs it, starts
#     GameActivity with `--esa cwArguments --smoke`, and logcat has to contain the smoke
#     harness's own verdict. That last one is the only gate in this file that proves anything
#     about running rather than compiling, and it is why stdout is mirrored to logcat.
#
# WHAT IT DOES NOT MEAN. No runner may hold the game, so the guest image is the stub from
# tools/gen_stub_ppc.py: this APK installs, boots, reports a missing package and exercises every
# Android code path this port added. It does not play Dead Rising. An APK that plays is the same
# command with CW_PPC_DIR pointing at a ppc/ tree generated on a machine that has the XEX.
#
# THE EMULATOR JOB RUNS ON master AND ON DEMAND, NOT ON EVERY PULL REQUEST, and that is a
# decision about cost rather than about confidence: it cross-builds all four dependencies a
# second time for x86_64 and boots an emulator, which is the difference between a ~15-minute
# check and a ~40-minute one on a workflow whose other job already proves the sources compile
# and the artifact packages.
#
# THE THIRD JOB, `playable`, IS NONE OF THE ABOVE. It runs only on an explicit dispatch, it is
# the only job in this repository that is given a copy of the game, and it is the only one that
# can produce an APK somebody could actually play. It is documented at its own head, including
# the input it cannot satisfy (shaders) and why.
name: android

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI to build"
        type: choice
        default: arm64-v8a
        options: [arm64-v8a, x86_64]
      run_emulator_gate:
        description: "Also boot the APK on an x86_64 emulator and run --smoke"
        type: boolean
        default: true

      # --- the playable build. See the `playable` job for what these actually buy. ---
      xex_url:
        description: "DIRECT download URL. Give the STFS PACKAGE, not a bare default.xex: the package also carries data/shaders/*.big, which is the only source the shader cache can be built from. Leave empty to use the CW_XEX_URL secret. On a PUBLIC repo this field is visible on the run page."
        type: string
        default: ""
      xex_sha256:
        description: "Optional SHA-256 of that file, to prove the download is the image you meant"
        type: string
        default: ""
      artifact:
        description: "What to publish. This repo is PUBLIC: an APK built from your XEX contains game-derived code, and Actions artifacts on a public repo can be downloaded by anyone."
        type: choice
        default: "logs only"
        options:
          - "logs only"
          - "APK too - publishes game-derived data publicly for 1 day"

env:
  # The same pinned bases build.yml uses, and for the same reason: the vendored patches in
  # tools/ci/ apply onto these commits, and a stale pin fails loudly at `git apply` naming the
  # script that regenerates them.
  XENON_BASE: ddd128bcca99fe8bfbb99bea583c972351fa6ace
  XENOS_BASE: 990d03b28a27b50277ee5d8d942e1c5f873869d1
  # Pinned here rather than discovered, because "the newest Gradle" is a build variable nobody
  # decided on. Must match android/gradle/wrapper/gradle-wrapper.properties.
  GRADLE_VERSION: "8.11.1"

jobs:
  # -----------------------------------------------------------------------------------------
  # The artifact: arm64-v8a, which is the only ABI a player's phone can use.
  # -----------------------------------------------------------------------------------------
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: install ninja and unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip

      - name: install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          curl -fsSL --retry 3 -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          /opt/gradle-${GRADLE_VERSION}/bin/gradle --version | head -6

      # The NDK is read from android/gradle.properties rather than hardcoded here: one pin, in
      # the file the build already reads, and tools/android/_ndk.sh resolves the same value.
      - name: make sure the pinned NDK is installed
        run: |
          NDKV=$(sed -n 's/^cw\.ndkVersion=\(.*\)$/\1/p' android/gradle.properties)
          echo "pinned NDK: $NDKV"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          if [ ! -d "$SDK/ndk/$NDKV" ]; then
            echo "installing ndk;$NDKV"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDKV" >/dev/null
          fi
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDKV" >> "$GITHUB_ENV"

      - name: clone recompilers at pinned bases and apply local patches
        run: |
          git clone --recursive https://github.com/hedge-dev/XenonRecomp ../XenonRecomp
          git -C ../XenonRecomp checkout $XENON_BASE
          git -C ../XenonRecomp submodule update --init --recursive
          git -C ../XenonRecomp apply "$PWD/tools/ci/xenonrecomp-local.patch"
          git clone https://github.com/hedge-dev/XenosRecomp ../XenosRecomp
          git -C ../XenosRecomp checkout $XENOS_BASE
          git -C ../XenosRecomp submodule update --init thirdparty/dxc-bin
          git -C ../XenosRecomp apply "$PWD/tools/ci/xenosrecomp-local.patch"

      # The four cross-compiled dependencies are the expensive part of this workflow (SDL2 and
      # ffmpeg from source, adrenotools with its submodule, XenonUtils for arm64) and none of
      # them depend on this repository's sources — so they are cached on the hashes of the
      # scripts and versions that produce them. A runtime edit is then one Gradle invocation
      # instead of twenty minutes of cross-compiling.
      - name: cache the cross-compiled dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            third_party/android/${{ inputs.abi || 'arm64-v8a' }}/sdl2
            third_party/android/${{ inputs.abi || 'arm64-v8a' }}/ffmpeg
            third_party/android/${{ inputs.abi || 'arm64-v8a' }}/adrenotools
            third_party/android/sdl-java
            ../XenonRecomp/build-android-${{ inputs.abi || 'arm64-v8a' }}
          key: cw-android-deps-${{ inputs.abi || 'arm64-v8a' }}-${{ hashFiles('tools/android/**', 'android/gradle.properties') }}
          restore-keys: |
            cw-android-deps-${{ inputs.abi || 'arm64-v8a' }}-

      - name: build the APK
        run: |
          tools/android/build_apk.sh --abi "${{ inputs.abi || 'arm64-v8a' }}" 2>&1 | tee apk-build.log
          exit "${PIPESTATUS[0]}"

      # What the artifact contains, published whether the build passed or not: a red step whose
      # error text is unreachable cannot be iterated on, and this repo's sessions read CI through
      # the public API, which serves step verdicts but not step logs (build.yml learned that the
      # hard way on its Windows job).
      - name: describe the artifact
        if: always()
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1 || true)
          if [ -n "$APK" ]; then
            echo "=== $APK ($(stat -c%s "$APK") bytes) ==="
            unzip -l "$APK" | sed -n '1,60p'
          else
            echo "no APK was produced"
          fi

      - name: publish the logs the API cannot serve
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          if-no-files-found: ignore
          path: |
            apk-build.log
            android/app/build/**/*.log
            /var/tmp/cw-sdl2-android/build-*/configure.log
            /var/tmp/cw-ffmpeg-android/build-*/configure.log
            /var/tmp/cw-adrenotools/build-*/configure.log

      - name: upload the APK
        uses: actions/upload-artifact@v4
        with:
          # Named for what it is: a stub-image build. An artifact called "casewest.apk" that
          # somebody installs expecting a game is a support request waiting to happen.
          name: casewest-android-stub-image-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # -----------------------------------------------------------------------------------------
  # The gate that proves it RUNS. x86_64, because that is the only ABI an emulator on a
  # GitHub-hosted x86_64 runner can execute; the arm64 artifact above is the one that ships.
  # -----------------------------------------------------------------------------------------
  boot:
    # push: always. pull_request: never (see the cost note above). dispatch: only when the box is
    # ticked — the input existed before this condition did, and an input that cannot change
    # anything is a control that lies about being one.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_emulator_gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: install ninja and unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip

      - name: install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          curl -fsSL --retry 3 -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: make sure the pinned NDK is installed
        run: |
          NDKV=$(sed -n 's/^cw\.ndkVersion=\(.*\)$/\1/p' android/gradle.properties)
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          [ -d "$SDK/ndk/$NDKV" ] || yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDKV" >/dev/null
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDKV" >> "$GITHUB_ENV"

      - name: clone recompilers at pinned bases and apply local patches
        run: |
          git clone --recursive https://github.com/hedge-dev/XenonRecomp ../XenonRecomp
          git -C ../XenonRecomp checkout $XENON_BASE
          git -C ../XenonRecomp submodule update --init --recursive
          git -C ../XenonRecomp apply "$PWD/tools/ci/xenonrecomp-local.patch"
          git clone https://github.com/hedge-dev/XenosRecomp ../XenosRecomp
          git -C ../XenosRecomp checkout $XENOS_BASE
          git -C ../XenosRecomp submodule update --init thirdparty/dxc-bin
          git -C ../XenosRecomp apply "$PWD/tools/ci/xenosrecomp-local.patch"

      - name: cache the x86_64 dependencies
        uses: actions/cache@v4
        with:
          path: |
            third_party/android/x86_64/sdl2
            third_party/android/x86_64/ffmpeg
            third_party/android/sdl-java
            ../XenonRecomp/build-android-x86_64
          key: cw-android-deps-x86_64-${{ hashFiles('tools/android/**', 'android/gradle.properties') }}
          restore-keys: cw-android-deps-x86_64-

      # adrenotools is arm64-only and is expected to fail here; build_apk.sh treats that as a
      # warning and continues without custom driver support, which is exactly the degradation
      # gpu/vk_shadow_android.cpp is written for.
      - name: build the x86_64 APK
        run: |
          tools/android/build_apk.sh --abi x86_64 2>&1 | tee apk-build-x86_64.log
          exit "${PIPESTATUS[0]}"

      - name: enable KVM
        run: |
          # The emulator needs /dev/kvm and the runner's user is not in the kvm group. Without
          # this the boot takes ten minutes of software emulation and the job times out looking
          # like a hung app rather than a missing permission.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: boot the APK and run --smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # No window, no audio, no boot animation: nothing in this gate looks at pixels, and
          # each of the three is a way for a headless runner to be slow.
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel on
          disable-animations: true
          script: |
            set -e
            APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
            echo "=== installing $APK ==="
            adb install -r "$APK"

            adb logcat -c
            echo "=== starting GameActivity with --smoke ==="
            # The arguments reach SDL_main through GameActivity.getArguments(), which reads this
            # extra — the one way to give an Android app a command line. CwRuntimeMain's first
            # statement is the --smoke branch, so this runs exactly the gate build.yml runs.
            adb shell am start -n dev.casewest.android/.GameActivity --esa cwArguments "--smoke"

            echo "=== waiting for the harness's verdict ==="
            # The verdict is a printf, which is why stdout is mirrored to logcat alongside
            # stderr: on a platform where stdout is /dev/null, a gate that prints its answer to
            # nowhere is a gate that always looks like it hung.
            for i in $(seq 1 60); do
              if adb logcat -d -s CaseWest SDL AndroidRuntime | grep -qE \
                 'every generated symbol resolved|FAIL:|FATAL EXCEPTION|no Vulkan loader'; then
                break
              fi
              sleep 5
            done

            adb logcat -d -s CaseWest SDL AndroidRuntime DEBUG > smoke.log
            echo "=== logcat ==="
            cat smoke.log

            echo "=== asserting ==="
            # The positive assertion first, and the negative one second, because "no FAIL" would
            # also be true of an app that never started.
            grep -q 'OK: every generated symbol resolved' smoke.log \
              || { echo "FAIL: the smoke harness did not report success. If the log is empty the" \
                         "app never reached SDL_main — look for a broken-library or an" \
                         "UnsatisfiedLinkError line above."; exit 1; }
            ! grep -q 'FATAL EXCEPTION' smoke.log \
              || { echo "FAIL: the app crashed."; exit 1; }
            grep -q 'CW_ROOT=' smoke.log \
              || { echo "FAIL: CW_ROOT was never exported — the launcher's environment did not" \
                         "reach the runtime."; exit 1; }

      - name: publish the boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-boot-logs
          if-no-files-found: ignore
          path: |
            smoke.log
            apk-build-x86_64.log

  # -----------------------------------------------------------------------------------------
  # THE PLAYABLE BUILD — the only job in this repository that puts the real guest image in an
  # artifact, and therefore the only one that needs a copy of the game.
  #
  # It exists because the two other jobs are capped by a rule that cannot be relaxed: no runner
  # may hold copyrighted game data as a matter of course, so `apk` and `boot` build the stub from
  # tools/gen_stub_ppc.py and prove compile / link / package / boot. This job is opt-in, one
  # person's own dispatch, with the URL supplied by that person at that moment — which is the
  # difference between a repository that distributes a game and a repository whose owner built
  # their own copy on rented hardware.
  #
  # WHAT IT DOES: download default.xex (or the STFS package, which it unpacks), generate ppc/
  # with the PATCHED host XenonRecomp, verify the generation actually happened, cross-compile the
  # four dependencies, and build an APK whose guest image is the title's own 58k functions.
  #
  # WHAT IT STILL DOES NOT GIVE YOU: shaders. Both paths that produce them need DXC — the
  # first-run disc pass (gpu/shader_prebuild.cpp) reads data/shaders/deadrisingepilogue-{ps,vs}.big
  # out of the PACKAGE, and the translate-on-first-sight path needs a library the phone does not
  # have, there being no prebuilt arm64 libdxcompiler.so anywhere. So a dispatch that supplies a
  # bare default.xex gets a correct ppc/ and no cache at all: the banks are not in the executable.
  # The APK boots, loads the real image and refuses each shader translation with one log line — see
  # the closing summary this job prints, which names both ways to fix it.
  # -----------------------------------------------------------------------------------------
  playable:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Generating 58k functions and then compiling 228 arm64 translation units of them, on a
    # 4-core runner, is not a fast job. The limit is set from what the steps need rather than
    # from a default, because a job cancelled at 360 minutes with no artifact is indistinguishable
    # from a job that hung.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: resolve the download URL
        env:
          INPUT_URL: ${{ inputs.xex_url }}
          SECRET_URL: ${{ secrets.CW_XEX_URL }}
        run: |
          # The secret is the channel to prefer, and not only for tidiness: on a PUBLIC repo a
          # workflow_dispatch input is recorded on the run page, which is public, so a link typed
          # into the form is a link anybody watching this repository can read. add-mask keeps the
          # value out of the LOG, which is the part this job controls; it cannot retract what the
          # dispatch form already published. That is why the secret exists.
          URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$URL" ]; then
            echo "::error::No URL. Set the CW_XEX_URL repository secret (preferred) or fill the xex_url input."
            exit 1
          fi
          if [ -n "$INPUT_URL" ]; then
            echo "::warning::xex_url was passed as a dispatch input on a PUBLIC repository, so the value is visible on this run's page. Delete and re-run with the CW_XEX_URL secret if that link is not already public."
          fi
          echo "::add-mask::$URL"
          echo "XEX_URL=$URL" >> "$GITHUB_ENV"
          echo "url resolved and masked (it will not be printed again by any step below)"

      - name: download it
        run: |
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o /tmp/download.bin "$XEX_URL"
          echo "downloaded $(stat -c%s /tmp/download.bin) bytes"
          if [ -n "${{ inputs.xex_sha256 }}" ]; then
            echo "${{ inputs.xex_sha256 }}  /tmp/download.bin" | sha256sum -c - \
              || { echo "::error::SHA-256 mismatch: the download is not the file you meant."; exit 1; }
          fi

      - name: work out what was downloaded
        run: |
          python3 - <<'PY'
          import os, sys, subprocess
          magic = open('/tmp/download.bin','rb').read(4)
          print(f"first four bytes: {magic!r}")
          if magic == b'XEX2':
              kind = 'xex'
          elif magic in (b'CON\x00', b'LIVE', b'PIRS'):
              kind = 'package'
          elif magic[:1] in (b'<', b'{'):
              # The failure worth naming specifically: a share page rather than a file. curl -fL
              # follows redirects and happily saves the HTML a file host serves for a link that
              # was never a direct-download link, and the error would otherwise arrive forty
              # minutes later as "XenonRecomp produced nothing".
              print("::error::That URL served a web page, not a file. Google Drive/Dropbox/OneDrive "
                    "share links do this. You need a DIRECT download link (for Drive, "
                    "https://drive.google.com/uc?export=download&id=<ID>), or host it somewhere "
                    "that serves bytes.")
              sys.exit(1)
          else:
              print(f"::error::Unrecognised file (magic {magic!r}). Expected an XEX2 executable or "
                    "an XContent package (CON/LIVE/PIRS).")
              sys.exit(1)

          os.makedirs('assets/game', exist_ok=True)
          if kind == 'xex':
              os.replace('/tmp/download.bin', 'assets/game/default.xex')
              print("a bare default.xex -> assets/game/default.xex")
          else:
              print("an XContent package -> tools/extract_stfs.py")
              subprocess.run([sys.executable, 'tools/extract_stfs.py', '/tmp/download.bin',
                              '-o', 'assets/game'], check=True)
              if not os.path.exists('assets/game/default.xex'):
                  print("::error::extract_stfs.py ran but produced no default.xex.")
                  sys.exit(1)
          print(f"assets/game/default.xex: {os.path.getsize('assets/game/default.xex')} bytes")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: install ninja and unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip

      - name: install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          curl -fsSL --retry 3 -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: make sure the pinned NDK is installed
        run: |
          NDKV=$(sed -n 's/^cw\.ndkVersion=\(.*\)$/\1/p' android/gradle.properties)
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          [ -d "$SDK/ndk/$NDKV" ] || yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDKV" >/dev/null
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDKV" >> "$GITHUB_ENV"

      - name: clone recompilers at pinned bases and apply local patches
        run: |
          git clone --recursive https://github.com/hedge-dev/XenonRecomp ../XenonRecomp
          git -C ../XenonRecomp checkout $XENON_BASE
          git -C ../XenonRecomp submodule update --init --recursive
          # The patch is not optional here in a way it is not optional anywhere else either, but
          # this is the job where skipping it fails QUIETLY: config/CaseWest.toml records that this
          # title's XEX uses the devkit all-zero key, that stock XenonRecomp hardcodes the retail
          # key, and that the wrong key yields an empty Image with no diagnostic at all. The patch
          # is what makes Xex2LoadImage try both.
          git -C ../XenonRecomp apply "$PWD/tools/ci/xenonrecomp-local.patch"
          git clone https://github.com/hedge-dev/XenosRecomp ../XenosRecomp
          git -C ../XenosRecomp checkout $XENOS_BASE
          git -C ../XenosRecomp submodule update --init thirdparty/dxc-bin
          git -C ../XenosRecomp apply "$PWD/tools/ci/xenosrecomp-local.patch"

      - name: build the host XenonRecomp (the tool that generates ppc/)
        run: |
          cmake -S ../XenonRecomp -B ../XenonRecomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build ../XenonRecomp/build --target XenonRecomp -j"$(nproc)"
          test -x ../XenonRecomp/build/XenonRecomp/XenonRecomp

      - name: generate the guest image
        run: |
          # `ppc/` must exist first: XenonRecomp segfaults in fwrite otherwise, which is recorded
          # in CLAUDE.md's Commands section as a thing somebody already paid for.
          mkdir -p ppc
          # Run from config/, because CaseWest.toml's paths are relative to it:
          # file_path = "../assets/game/default.xex", out_directory_path = "../ppc",
          # switch_table_file_path = "CaseWest_switch_tables.toml" (committed, so the 205 jump
          # tables do not have to be re-derived here).
          ( cd config && ../../XenonRecomp/build/XenonRecomp/XenonRecomp \
              CaseWest.toml ../../XenonRecomp/XenonUtils/ppc_context.h )
          echo "generated $(find ppc -name '*.cpp' | wc -l) .cpp files, $(du -sh ppc | cut -f1)"

      - name: verify the generation was not the silent empty-image failure
        run: |
          # The one check that catches the trap config/CaseWest.toml documents. A wrong decryption
          # key does not error: it produces an Image with no sections, XenonRecomp emits almost
          # nothing, exits 0, and the failure surfaces an hour later as an APK that boots to a
          # crash. Counting the mapping table costs a second and turns that into a named error.
          MAP=ppc/ppc_func_mapping.cpp
          test -f "$MAP" || { echo "::error::$MAP is missing — XenonRecomp produced no image."; exit 1; }
          # An entry is `\t{ 0x82XXXXXX, sub_82XXXXXX },` and every address in this title is
          # inside the image at 0x82000000, so an 8-hex-digit 0x8... is one entry and nothing
          # else in that file matches it.
          N=$(grep -c '0x8[0-9A-Fa-f]\{7\}' "$MAP" || true)
          echo "mapping entries referencing guest addresses: $N (this title is documented at 58,448 functions)"
          if [ "$N" -lt 40000 ]; then
            echo "::error::Only $N entries. That is the signature of an image XenonRecomp could not"
            echo "::error::decrypt — almost certainly the XEX key. config/CaseWest.toml records that"
            echo "::error::this title uses the devkit all-zero key and that tools/ci/xenonrecomp-local.patch"
            echo "::error::is what makes Xex2LoadImage try both. Check that the patch applied above."
            exit 1
          fi

      - name: cache the cross-compiled dependencies
        uses: actions/cache@v4
        with:
          path: |
            third_party/android/${{ inputs.abi }}/sdl2
            third_party/android/${{ inputs.abi }}/ffmpeg
            third_party/android/${{ inputs.abi }}/adrenotools
            third_party/android/sdl-java
            ../XenonRecomp/build-android-${{ inputs.abi }}
          key: cw-android-deps-${{ inputs.abi }}-${{ hashFiles('tools/android/**', 'android/gradle.properties') }}
          restore-keys: cw-android-deps-${{ inputs.abi }}-

      - name: build the APK from the real image
        run: |
          CW_PPC_DIR="$PWD/ppc" tools/android/build_apk.sh --abi "${{ inputs.abi }}" 2>&1 \
            | tee playable-build.log
          exit "${PIPESTATUS[0]}"

      - name: publish the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-playable-logs
          if-no-files-found: ignore
          path: |
            playable-build.log
            apk-build.log

      - name: publish the APK, if it was asked for
        if: inputs.artifact != 'logs only'
        uses: actions/upload-artifact@v4
        with:
          name: casewest-android-playable-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          # One day, and the choice input that got here said so in its own label. This APK contains
          # code derived from a copyrighted executable and the repository is public, which makes
          # the artifact a public download for as long as it is retained. Nothing in a workflow can
          # make that private; the only lever is how long the window is, so it is as short as
          # GitHub allows while still being usable.
          retention-days: 1

      - name: what this artifact is, and what it still needs
        if: always()
        run: |
          echo "==================== READ THIS ===================="
          echo "guest image : REAL (generated from your XEX in this run)"
          echo "abi         : ${{ inputs.abi }}"
          echo "published   : ${{ inputs.artifact }}"
          echo
          echo "It will boot, run the title's own code, and reach the renderer. Whether it"
          echo "draws anything depends on DXC, which nothing on this runner can supply for"
          echo "arm64: BOTH shader paths go through it."
          echo
          echo "  * The first-run pass (gpu/shader_prebuild.cpp) builds the cache headlessly"
          echo "    from the game's own banks, data/shaders/deadrisingepilogue-{ps,vs}.big —"
          echo "    so it needs the PACKAGE, not a bare default.xex, and it needs DXC to"
          echo "    translate what it decodes."
          echo "  * The vertex half additionally needs tools/release/vs_recipes.bin, which is"
          echo "    NOT in this repository: tools/vs_recipes.py generates it from a microcode"
          echo "    dump of a machine that has run the game. Without it the pass is"
          echo "    pixel-only and every vertex shader falls to first sight, on the phone."
          echo "  * On the phone, translating means an arm64 libdxcompiler.so, and Microsoft"
          echo "    ships dxc for x86/x64 Linux only."
          echo
          echo "Two ways to finish it, pick one:"
          echo
          echo "  A. Build the cache on a desktop that can run the game once, then rebuild:"
          echo "       CZ_SHADER_DUMP=~/ucode ./cw_runtime        # play to the title screen"
          echo "       tools/build_shader_spv.sh ~/ucode"
          echo "       CW_SHADER_SPV=$PWD/assets/shader_spv \\"
          echo "       CW_PPC_DIR=$PWD/ppc tools/android/build_apk.sh"
          echo "     (build_apk.sh stages CW_SHADER_SPV into the APK's assets and the launcher"
          echo "      copies it to <root>/assets/shader_spv/ at first run.)"
          echo
          echo "  B. Put an arm64 libdxcompiler.so in third_party/android/<abi>/jniLibs/ and"
          echo "     rebuild: it lands in nativeLibraryDir, which gpu/shader_translator.cpp"
          echo "     already searches as ExeDir()/libdxcompiler.so. First boot then translates"
          echo "     in-process — correct, and slow, once."
          echo "==================================================="
